apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  labels:
    app.kubernetes.io/managed-by: pac-kyverno-dashboard
    pac.kyverno.io/request-id: req-to-delete
  name: pac-exception-req-12345
  namespace: test-ns
spec:
  exceptions:
    - policyName: disallow-latest-tag
      ruleNames:
        - require-image-tag
        - autogen-require-image-tag
  match:
    any:
      - resources:
          kinds:
            - Deployment
          names:
            - sample-app
          namespaces:
            - test-ns
      - resources:
          kinds:
            - Pod
          names:
            - sample-app-*
          namespaces:
            - test-ns
